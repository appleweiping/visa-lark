name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The apps import the packages' built output, so build those first.
      - run: pnpm build:packages
      - run: pnpm -r --filter "!@visa-lark/web" test
      - run: pnpm --filter @visa-lark/extension build
      - name: Zip the unpacked extension
        run: cd apps/extension/dist && zip -r -q "$GITHUB_WORKSPACE/visalark-extension.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: visalark-extension
          path: visalark-extension.zip

  web:
    # The landing page deployed at visa-lark.vercel.app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @visa-lark/web typecheck
      - run: pnpm --filter @visa-lark/web lint
      - run: pnpm --filter @visa-lark/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  release:
    # Runs only for version tags, and only after the tests and the builds above passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: visalark-extension
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv visalark-extension.zip "visalark-extension-$TAG.zip"
          cat > notes.md <<'NOTES'
          Unpacked Chrome/Edge (Manifest V3) build of the VisaLark extension, built by CI from this tag.

          **Install:** unzip, open `chrome://extensions` (or `edge://extensions`), turn on Developer mode, click *Load unpacked* and pick the unzipped folder.

          **Read before use:** automated access to the visa appointment site may break its terms of service and can get your account restricted. The extension only uses the session you are already logged into, never stores your password and does not solve CAPTCHAs. Auto-reschedule is off by default and experimental; try it in dry-run mode first.
          NOTES
          gh release create "$TAG" "visalark-extension-$TAG.zip" --repo "$GITHUB_REPOSITORY" --title "VisaLark $TAG" --notes-file notes.md
